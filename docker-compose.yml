version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: staystrong-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: staystrong
      POSTGRES_PASSWORD: staystrong_password
      POSTGRES_DB: staystrong_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
